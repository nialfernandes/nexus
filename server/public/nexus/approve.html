<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="noindex" />

    <title>Allow a device: Nexus</title>

    <!-- The Nexus app icon (nialfernandes #826), served beside the page like its stylesheet: the tab's icon, the sized PNGs for a browser that
         has no SVG icons, and the one a phone's home screen takes. -->
    <link rel="icon" type="image/svg+xml" href="/nexus/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/nexus/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/nexus/icon-512.png" />
    <link rel="apple-touch-icon" href="/nexus/apple-touch-icon.png" />

    <link rel="stylesheet" href="/nexus/approve.css" />
  </head>
  <body>
    <!-- THE DEVICE APPROVAL PAGE. A device asked Nexus for a sign-in and was handed a link to this page with a code on
         it. approve.js reads the code from the address, asks Nexus what is being asked, and fills this page in: the
         question with Allow and Deny, or one answer card (allowed, denied, code ran out, code used). When no owner is
         signed in to this browser, the first thing shown is one field for the owner secret. Each part is hidden until
         the script has something true to put in it, and everything a device sent (its label, its code) goes in as
         text, never as markup. The drawn look is docs/design/nexus boards 1 to 5; the owner-secret card is not drawn. -->
    <div class="page">
      <header class="slab">
        <div class="slab__row">
          <div class="slab__name">
            <span class="slab__mark">nexus</span>
            <span class="slab__divider" aria-hidden="true"></span>
            <h1 class="slab__title" id="title">new device</h1>
          </div>
        </div>
      </header>

      <main class="content">
        <p class="lead" id="line" role="status">Checking the code…</p>

        <!-- The owner secret, for a browser that is not signed in as the owner. Nothing is kept: the script holds it
             until the code is answered. -->
        <section class="card" id="owner" hidden>
          <form class="owner" id="owner-form" autocomplete="off" novalidate>
            <p class="card__words" id="owner-words">Type the owner secret to see who is asking.</p>
            <div class="field">
              <label class="field__label" for="secret">OWNER SECRET</label>
              <input class="field__input" id="secret" name="secret" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />
            </div>
            <p class="card__quiet card__quiet--fault" id="owner-alert" role="alert" hidden></p>
            <div class="actions">
              <button type="submit" class="pill pill--main" id="owner-go">Continue</button>
            </div>
          </form>
        </section>

        <!-- The question. -->
        <section class="card" id="ask" hidden>
          <p class="card__words" id="question"></p>
          <p class="card__quiet" id="hint"></p>
          <div class="code">
            <p class="code__label">DEVICE CODE</p>
            <div class="code__boxes" id="code" role="img"></div>
          </div>
          <div class="actions" id="actions">
            <button type="button" class="pill pill--main" id="allow">Allow</button>
            <button type="button" class="pill pill--quiet" id="deny">Deny</button>
          </div>
          <p class="card__quiet card__quiet--fault" id="alert" role="alert" hidden></p>
        </section>

        <!-- The answer, or a code that cannot be answered. One mark shows. -->
        <section class="card" id="result" hidden>
          <span class="mark mark--allowed" id="mark-allowed" aria-hidden="true" hidden>
            <svg class="mark__icon" width="18" height="18" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M4 10.5l4 4L16 6" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /></svg>
          </span>
          <span class="mark mark--denied" id="mark-denied" aria-hidden="true" hidden>
            <svg class="mark__icon" width="16" height="16" viewBox="0 0 14 14" xmlns="http://www.w3.org/2000/svg"><path d="M2 2l10 10M12 2L2 12" fill="none" stroke-width="2.2" stroke-linecap="round" /></svg>
          </span>
          <span class="mark mark--fault" id="mark-expired" aria-hidden="true" hidden>
            <svg class="mark__icon" width="18" height="18" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><circle cx="10" cy="10" r="7.5" fill="none" stroke-width="2" /><path d="M10 5.5V10l3 2" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
          </span>
          <span class="mark mark--fault" id="mark-used" aria-hidden="true" hidden>
            <svg class="mark__icon" width="16" height="16" viewBox="0 0 14 14" xmlns="http://www.w3.org/2000/svg"><path d="M2 2l10 10M12 2L2 12" fill="none" stroke-width="2.2" stroke-linecap="round" /></svg>
          </span>
          <p class="card__words" id="said"></p>
          <p class="card__quiet" id="quiet"></p>
        </section>
      </main>
    </div>
    <script src="/nexus/approve.js"></script>
  </body>
</html>
