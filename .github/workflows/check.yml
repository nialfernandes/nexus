# Runs every package's checks on every pull request and every push to main. It needs no secret and deploys nothing.
#
# `npm run check` at the root first checks that every `uses:` line in .github/workflows names its action by a full commit
# hash (a tag can be moved to other code, which would then run here; the tag goes in a trailing comment), then builds the
# encryption package, type-checks every package, builds the plugin and runs every package's tests. A package added to the
# workspaces in the root package.json is checked here without a change to this file.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install every package
        run: npm ci
      - name: Check every package
        run: npm run check
      - name: Check the citations in the docs
        run: bash docs/check-citations.sh
