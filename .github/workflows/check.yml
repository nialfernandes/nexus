# Runs every package's checks on every pull request and every push to main. It needs no secret and deploys nothing.
#
# `npm run check` at the root first checks that every `uses:` line in .github/workflows names its action by a full commit
# hash (a tag can be moved to other code, which would then run here; the tag goes in a trailing comment), runs the tests of
# the scripts the release workflow (release.yml) stands on, then builds the
# encryption package and the agent library, type-checks every package, builds the linking job and the plugin and runs every package's tests. A package added to the
# workspaces in the root package.json is checked here without a change to this file.
#
# After that, the approval page is looked at in a real browser (server/e2e/approve.spec.ts, at 375 and 1280 px). That needs Playwright's
# Chromium, which `npm ci` does not download, so it is its own two steps here and not part of `npm run check` (which has to run on a
# machine with Node and nothing else). Neither step uses an action: the browser comes from the Playwright that package-lock.json pins.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install every package
        run: npm ci
      - name: Check every package
        run: npm run check
      - name: Install the browser the approval page is checked in
        run: npx playwright install --with-deps chromium
        working-directory: server
      - name: Check the approval page in a browser
        run: npm run test:browser
        working-directory: server
      - name: Check the citations in the docs
        run: bash docs/check-citations.sh
